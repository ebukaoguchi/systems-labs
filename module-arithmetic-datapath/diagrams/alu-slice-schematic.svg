  <text x="24" y="36" font-size="22" font-weight="bold" fill="#1a202c">A 1-bit ALU slice at gate level</text>
  <text x="24" y="60" font-size="14" fill="#4a5568">The adder always runs, with B flippable for subtraction. AND and OR are computed alongside, and two select stages choose what reaches F. One 7486, two 7408s, one 7432, one 7404.</text>
  <rect x="200" y="230" width="810" height="270" fill="#f7fafc" stroke="#a0aec0" stroke-dasharray="6 4"/>
