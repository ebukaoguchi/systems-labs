<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 400" font-family="sans-serif">
  <rect x="0" y="0" width="920" height="400" fill="#ffffff"/>
  <text x="20" y="34" font-size="22" font-weight="bold" fill="#1a202c">Optimized multiplier: the multiplier lives inside the product</text>
  <text x="20" y="58" font-size="14" fill="#4a5568">One combined register does two jobs. Multiplier bits are consumed from the right as product bits form.</text>

  <!-- multiplicand -->
  <rect x="40" y="110" width="240" height="64" fill="#ebf4ff" stroke="#2b6cb0" stroke-width="2"/>
  <text x="60" y="136" font-size="14" font-weight="bold" fill="#1a202c">Multiplicand register</text>
  <text x="60" y="158" font-size="13.5" fill="#1a202c">fixed; never shifts</text>

  <!-- ALU -->
  <rect x="360" y="110" width="170" height="64" fill="#fffaf0" stroke="#b7791f" stroke-width="2"/>
  <text x="445" y="136" font-size="15" font-weight="bold" fill="#1a202c" text-anchor="middle">ALU (add)</text>
  <text x="445" y="158" font-size="13" fill="#1a202c" text-anchor="middle">adds to upper half only</text>

  <!-- combined product register -->
  <rect x="610" y="96" width="290" height="92" fill="#faf5ff" stroke="#6b46c1" stroke-width="2"/>
  <line x1="755" y1="96" x2="755" y2="188" stroke="#6b46c1" stroke-width="2"/>
  <text x="682" y="122" font-size="13.5" font-weight="bold" fill="#1a202c" text-anchor="middle">Upper half</text>
  <text x="682" y="142" font-size="12.5" fill="#1a202c" text-anchor="middle">partial product</text>
  <text x="682" y="160" font-size="12.5" fill="#1a202c" text-anchor="middle">(starts at 0)</text>
  <text x="827" y="122" font-size="13.5" font-weight="bold" fill="#1a202c" text-anchor="middle">Lower half</text>
  <text x="827" y="142" font-size="12.5" fill="#1a202c" text-anchor="middle">multiplier, becoming</text>
  <text x="827" y="160" font-size="12.5" fill="#1a202c" text-anchor="middle">the low product bits</text>
  <text x="755" y="82" font-size="14" font-weight="bold" fill="#1a202c" text-anchor="middle">Combined product register (64 bits)</text>

  <!-- arrows -->
  <g stroke="#4a5568" stroke-width="2.5" fill="none">
    <line x1="280" y1="142" x2="352" y2="142"/>
    <line x1="530" y1="142" x2="602" y2="142"/>
    <path d="M 755 188 L 755 250 L 445 250 L 445 182"/>
    <path d="M 890 250 L 890 300 L 640 300"/>
  </g>
  <g fill="#4a5568">
    <polygon points="352,136 364,142 352,148"/>
    <polygon points="602,136 614,142 602,148"/>
    <polygon points="439,182 445,170 451,182"/>
    <polygon points="640,294 628,300 640,306"/>
  </g>
  <text x="560" y="242" font-size="13" fill="#4a5568">upper half feeds back into the ALU</text>
  <text x="650" y="322" font-size="13.5" fill="#1a202c">whole register shifts right, once per cycle</text>

  <!-- control -->
  <rect x="40" y="220" width="330" height="64" fill="#fff5f5" stroke="#c53030" stroke-width="2"/>
  <text x="60" y="246" font-size="14" font-weight="bold" fill="#1a202c">Control</text>
  <text x="60" y="268" font-size="13.5" fill="#1a202c">tests the product register's LSB</text>
  <path d="M 370 252 L 560 252 L 560 196" stroke="#c53030" stroke-width="2.5" fill="none" stroke-dasharray="6 4"/>
  <text x="420" y="242" font-size="13" fill="#c53030">LSB (rightmost bit of lower half)</text>

  <text x="40" y="330" font-size="14" fill="#1a202c">Loop, exactly 32 times for 32-bit values:</text>
  <text x="40" y="354" font-size="14" fill="#1a202c">1. Test LSB &#8594; 2. Add multiplicand to upper half if 1 &#8594; 3. Shift whole register right</text>
  <text x="40" y="382" font-size="13.5" fill="#4a5568">Saved: the separate multiplier register and its shifter. Still about n cycles: the saving is hardware, not time.</text>
</svg>
