<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 460" font-family="sans-serif">
  <rect x="0" y="0" width="1040" height="460" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="bold" fill="#1a202c">One full adder at gate level</text>
  <text x="24" y="60" font-size="14" fill="#4a5568">Two half adders and an OR gate. Built from one 7486 (XOR), one 7408 (AND) and one 7432 (OR).</text>

  <!-- half adder boxes -->
  <rect x="170" y="105" width="330" height="187" fill="#f7fafc" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <rect x="540" y="105" width="270" height="187" fill="#f7fafc" stroke="#a0aec0" stroke-dasharray="6 4"/>
  <text x="186" y="130" font-size="12" letter-spacing="2" fill="#718096">HALF ADDER 1</text>
  <text x="556" y="130" font-size="12" letter-spacing="2" fill="#718096">HALF ADDER 2</text>

  <!-- wires -->
  <g stroke="#2d3748" stroke-width="2" fill="none">
    <!-- A distribution -->
    <path d="M70,151 H262"/>
    <path d="M215,151 V225 H270"/>
    <!-- B distribution -->
    <path d="M70,247 H240"/>
    <path d="M240,247 V173 H262"/>
    <path d="M240,247 H270"/>
    <!-- S1: XOR1 output to XOR2 lower input and AND2 upper input -->
    <path d="M336,162 H566 V173 H612"/>
    <path d="M566,173 V225 H620"/>
    <!-- Cin distribution -->
    <path d="M70,398 H520 V151 H612"/>
    <path d="M520,247 H620"/>
    <!-- C1: AND1 output to OR lower input -->
    <path d="M322,236 H430 V300 H824"/>
    <!-- C2: AND2 output to OR upper input -->
    <path d="M672,236 H756 V278 H824"/>
    <!-- outputs -->
    <path d="M686,162 H940"/>
    <path d="M890,289 H940"/>
  </g>
  <!-- junction dots -->
  <g fill="#2d3748">
    <circle cx="215" cy="151" r="4"/>
    <circle cx="240" cy="247" r="4"/>
    <circle cx="566" cy="173" r="4"/>
    <circle cx="520" cy="247" r="4"/>
  </g>

  <!-- gates -->
  <g fill="#ebf4ff" stroke="#2d3748" stroke-width="2">
    <!-- XOR1 -->
    <path d="M270,140 Q284,162 270,184 Q300,180 336,162 Q300,144 270,140 Z"/>
    <path d="M262,140 Q276,162 262,184" fill="none"/>
    <!-- AND1 -->
    <path d="M270,214 L300,214 A22,22 0 0 1 300,258 L270,258 Z"/>
    <!-- XOR2 -->
    <path d="M620,140 Q634,162 620,184 Q650,180 686,162 Q650,144 620,140 Z"/>
    <path d="M612,140 Q626,162 612,184" fill="none"/>
    <!-- AND2 -->
    <path d="M620,214 L650,214 A22,22 0 0 1 650,258 L620,258 Z"/>
    <!-- OR -->
    <path d="M824,267 Q838,289 824,311 Q854,307 890,289 Q854,271 824,267 Z"/>
  </g>

  <!-- input and output labels -->
  <g font-size="16" font-weight="bold" fill="#1a202c">
    <text x="36" y="157">A</text>
    <text x="36" y="253">B</text>
    <text x="36" y="404">Cin</text>
    <text x="948" y="168">Sum</text>
    <text x="948" y="295">Cout</text>
  </g>
  <!-- gate and signal labels -->
  <g font-size="12" fill="#4a5568" text-anchor="middle">
    <text x="303" y="206">XOR</text>
    <text x="296" y="280">AND</text>
    <text x="653" y="206">XOR</text>
    <text x="646" y="280">AND</text>
    <text x="857" y="335">OR</text>
  </g>
  <g font-size="12" fill="#4a5568">
    <text x="440" y="152">S1 = A &#8853; B</text>
    <text x="600" y="290">C1</text>
    <text x="766" y="262">C2</text>
  </g>
</svg>
