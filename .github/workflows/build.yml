name: Build check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile all standalone C++ files
        run: |
          fail=0
          while IFS= read -r f; do
            echo "== $f"
            g++ -std=c++17 -Wall -Wextra -o /tmp/build_check_out "$f" || fail=1
          done < <(find . -name '*.cpp' -not -path './.git/*')
          exit $fail

      - name: Compile all standalone C files
        run: |
          fail=0
          while IFS= read -r f; do
            echo "== $f"
            gcc -std=c11 -Wall -Wextra -o /tmp/build_check_out "$f" || fail=1
          done < <(find . -name '*.c' -not -path './.git/*')
          exit $fail
