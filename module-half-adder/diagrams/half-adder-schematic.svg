<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" font-family="sans-serif">
  <rect x="0" y="0" width="760" height="300" fill="#ffffff"/>
  <text x="24" y="36" font-size="22" font-weight="bold" fill="#1a202c">One half adder at gate level</text>
  <text x="24" y="60" font-size="14" fill="#4a5568">One XOR gate and one AND gate: one gate of a 7486 and one gate of a 7408 on a breadboard.</text>

  <!-- wires -->
  <g stroke="#2d3748" stroke-width="2" fill="none">
    <!-- A distribution -->
    <path d="M70,129 H262"/>
    <path d="M215,129 V199 H270"/>
    <!-- B distribution -->
    <path d="M70,221 H270"/>
    <path d="M240,221 V151 H262"/>
    <!-- outputs -->
    <path d="M336,140 H610"/>
    <path d="M322,210 H610"/>
  </g>
  <!-- junction dots -->
  <g fill="#2d3748">
    <circle cx="215" cy="129" r="4"/>
    <circle cx="240" cy="221" r="4"/>
  </g>

  <!-- gates -->
  <g fill="#ebf4ff" stroke="#2d3748" stroke-width="2">
    <!-- XOR -->
    <path d="M270,118 Q284,140 270,162 Q300,158 336,140 Q300,122 270,118 Z"/>
    <path d="M262,118 Q276,140 262,162" fill="none"/>
    <!-- AND -->
    <path d="M270,188 L300,188 A22,22 0 0 1 300,232 L270,232 Z"/>
  </g>

  <!-- input and output labels -->
  <g font-size="16" font-weight="bold" fill="#1a202c">
    <text x="36" y="135">A</text>
    <text x="36" y="227">B</text>
    <text x="618" y="146">Sum</text>
    <text x="618" y="216">Carry</text>
  </g>
  <!-- gate and signal labels -->
  <g font-size="12" fill="#4a5568" text-anchor="middle">
    <text x="303" y="186">XOR</text>
    <text x="296" y="256">AND</text>
  </g>
  <g font-size="12" fill="#4a5568">
    <text x="450" y="128">Sum = A &#8853; B</text>
    <text x="450" y="198">Carry = A &#183; B</text>
  </g>
</svg>
